<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#059669" />
      <stop offset="0.6" stop-color="#0d9488" />
      <stop offset="1" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="favC1" x1="12" y1="18" x2="36" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" />
      <stop offset="1" stop-color="#ecfdf5" />
    </linearGradient>

    <linearGradient id="favC2" x1="28" y1="18" x2="52" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6ee7b7" />
      <stop offset="1" stop-color="#ffffff" />
    </linearGradient>

    <filter id="favShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#022c22" flood-opacity="0.35" />
    </filter>

    <filter id="favWeave" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.5" dy="1.5" stdDeviation="1.5" flood-color="#022c22" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="18" fill="url(#favBg)" />
  <rect x="1" y="1" width="62" height="62" rx="17" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.2" fill="none" />

  <!-- Left C (Care) -->
  <path
    d="M 36 41 A 13.5 13.5 0 1 1 36 23"
    stroke="url(#favC1)"
    stroke-width="5.5"
    stroke-linecap="round"
    fill="none"
    filter="url(#favShadow)"
  />

  <!-- Right C (Connect) -->
  <path
    d="M 52 41 A 13.5 13.5 0 1 1 52 23"
    stroke="url(#favC2)"
    stroke-width="5.5"
    stroke-linecap="round"
    fill="none"
    filter="url(#favShadow)"
  />

  <!-- Interlocking Weave (Left C Top Arm over Right C) -->
  <path
    d="M 30 18.8 A 13.5 13.5 0 0 1 36 23"
    stroke="url(#favC1)"
    stroke-width="5.5"
    stroke-linecap="round"
    fill="none"
    filter="url(#favWeave)"
  />
</svg>
